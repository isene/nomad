<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="fleet">
  <!-- The fleet logo of the Fe2O3 suite in few shapes: a radar over the sessions, the one that is done in rust. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#b7410e"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rust)" stroke-width="7"/>
  <!-- The radar -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="#3d5a76" stroke-width="6"/>
  <line x1="128" y1="128" x2="128" y2="46" stroke="#3d5a76" stroke-width="6" stroke-linecap="round"/>
  <!-- The sessions -->
  <g fill="#7aa2c0">
    <path d="M86 88 l-21 38 h42 z"/>
    <path d="M178 86 l-21 38 h42 z"/>
    <path d="M100 152 l-21 38 h42 z"/>
  </g>
  <path d="M162 138 l-26 48 h52 z" fill="url(#rust)"/>
</svg>
