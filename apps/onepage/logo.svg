<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="onepage">
  <!-- onepage has no twin in the Fe2O3 suite. Its icon is drawn by the rules the twins' icons follow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#b7410e"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rust)" stroke-width="7"/>
  <!-- One screen, a few widgets placed on it -->
  <rect x="76" y="48" width="104" height="160" rx="14" fill="none" stroke="#cfe8ff" stroke-width="8"/>
  <rect x="92" y="66" width="72" height="40" rx="6" fill="url(#rust)"/>
  <rect x="92" y="118" width="32" height="32" rx="6" fill="#3a7aff"/>
  <rect x="132" y="118" width="32" height="32" rx="6" fill="#4c4"/>
</svg>
