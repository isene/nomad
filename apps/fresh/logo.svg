<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="fresh">
  <!-- fresh has no twin in the Fe2O3 suite. Its icon is drawn by the rules the twins' icons follow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#b7410e"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rust)" stroke-width="7"/>
  <!-- An app coming down into the tray -->
  <line x1="128" y1="58" x2="128" y2="138" stroke="#4c4" stroke-width="18" stroke-linecap="round"/>
  <polyline points="92,108 128,144 164,108" fill="none" stroke="#4c4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 156 V188 H186 V156" fill="none" stroke="#cfe8ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
