<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="gazette">
  <!-- The gazette logo of the Fe2O3 suite in few shapes, so it reads at the size of an icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#b7410e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe2"/>
      <stop offset="1" stop-color="#ddd2bb"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rust)" stroke-width="7"/>
  <!-- The front page: the name, the lead story, two columns -->
  <g transform="rotate(-5 128 128)">
    <rect x="66" y="54" width="124" height="148" rx="8" fill="url(#paper)" stroke="#b7410e" stroke-width="4"/>
    <rect x="78" y="70" width="100" height="16" rx="3" fill="#0a0a14"/>
    <rect x="78" y="98" width="100" height="16" rx="4" fill="url(#rust)"/>
    <g fill="#6b6256">
      <rect x="78" y="128" width="44" height="10" rx="5"/>
      <rect x="78" y="150" width="44" height="10" rx="5"/>
      <rect x="78" y="172" width="32" height="10" rx="5"/>
      <rect x="134" y="128" width="44" height="10" rx="5"/>
      <rect x="134" y="150" width="44" height="10" rx="5"/>
      <rect x="134" y="172" width="38" height="10" rx="5"/>
    </g>
  </g>
</svg>
