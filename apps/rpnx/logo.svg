<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="rpnx">
  <!-- The rpnx logo of the Fe2O3 suite in few shapes, so it reads at the size of an icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#b7410e"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rust)" stroke-width="7"/>
  <!-- The stack with X lit, and the shift keys under it -->
  <rect x="52" y="66" width="152" height="124" rx="12" fill="#0d0d16" stroke="url(#rust)" stroke-width="7"/>
  <rect x="132" y="80" width="62" height="12" rx="6" fill="#8a8a99"/>
  <rect x="62" y="102" width="132" height="30" rx="6" fill="url(#rust)"/>
  <rect x="118" y="111" width="66" height="12" rx="6" fill="#0a0a14" opacity="0.8"/>
  <rect x="62" y="146" width="27" height="28" rx="5" fill="#e2b714"/>
  <rect x="97" y="146" width="27" height="28" rx="5" fill="#51afef"/>
  <rect x="132" y="146" width="27" height="28" rx="5" fill="#4ccc66"/>
  <rect x="168.5" y="147.5" width="24" height="25" rx="4" fill="#12121f" stroke="#f74c00" stroke-width="3"/>
</svg>
