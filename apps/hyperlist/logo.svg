<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="hyperlist">
  <!-- hyperlist has no twin in the Fe2O3 suite. Its icon is drawn by the rules the twins' icons follow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#b7410e"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rust)" stroke-width="7"/>
  <!-- A list in steps: an item, its children, a child of a child -->
  <rect x="52" y="74" width="152" height="12" rx="6" fill="url(#rust)"/>
  <g stroke="#cfe8ff" stroke-width="10" stroke-linecap="round">
    <line x1="90" y1="114" x2="198" y2="114"/>
    <line x1="122" y1="148" x2="188" y2="148"/>
    <line x1="90" y1="182" x2="172" y2="182"/>
  </g>
  <line x1="66" y1="104" x2="66" y2="186" stroke="#3a7aff" stroke-width="7" stroke-linecap="round"/>
</svg>
