<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="pointer">
  <!-- The pointer logo of the Fe2O3 suite in few shapes, so it reads at the size of an icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#b7410e"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rust)" stroke-width="7"/>
  <!-- Two panes: a list with one row picked out, and what that row has in it -->
  <rect x="50" y="68" width="156" height="120" rx="12" fill="#0d0d0d" stroke="url(#rust)" stroke-width="7"/>
  <line x1="128" y1="72" x2="128" y2="184" stroke="#f74c00" stroke-width="4" opacity="0.55"/>
  <rect x="62" y="84" width="56" height="22" rx="5" fill="url(#rust)"/>
  <rect x="62" y="122" width="44" height="14" rx="7" fill="#4c4"/>
  <rect x="62" y="152" width="52" height="14" rx="7" fill="#51afef"/>
  <g fill="#aab" opacity="0.6">
    <rect x="140" y="90" width="54" height="10" rx="5"/>
    <rect x="140" y="118" width="40" height="10" rx="5"/>
    <rect x="140" y="146" width="48" height="10" rx="5"/>
  </g>
</svg>
