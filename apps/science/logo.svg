<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="science">
  <!-- An atom in few shapes, so it reads at the size of an icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f74c00"/>
      <stop offset="1" stop-color="#b7410e"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)" stroke="url(#rust)" stroke-width="7"/>
  <ellipse cx="128" cy="128" rx="92" ry="34" fill="none" stroke="#5a96ff" stroke-width="7"/>
  <ellipse cx="128" cy="128" rx="92" ry="34" fill="none" stroke="#ffd046" stroke-width="7" transform="rotate(60 128 128)"/>
  <ellipse cx="128" cy="128" rx="92" ry="34" fill="none" stroke="#ff79c6" stroke-width="7" transform="rotate(120 128 128)"/>
  <circle cx="128" cy="128" r="20" fill="#ff6347"/>
</svg>
